<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mudra</title>
<meta name="theme-color" content="#7a1f2b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:light dark;--bg:#fbf6ef;--card:#fff;--ink:#2a1a14;--muted:#7b6a60;--line:#eadfd2;--accent:#7a1f2b;--accent-ink:#fff;--head:#7a1f2b;--gold:#c8902e;--ok:#2f7d4f;--ok-bg:#e3f3e8;--due:#b4471f;--due-bg:#fbe7dc;--up:#8a5a00;--up-bg:#fdf1d6;--tile:#f4ece2}
@media (prefers-color-scheme:dark){:root{--bg:#1b1412;--card:#251c19;--ink:#f3e9df;--muted:#b3a297;--line:#3a2d28;--accent:#e07a88;--accent-ink:#1b1412;--head:#4a1018;--gold:#e0b25a;--ok:#6cc792;--ok-bg:#1f3427;--due:#f08a5d;--due-bg:#3b2419;--up:#e8c26a;--up-bg:#3a2f17;--tile:#2f2420}}
*{box-sizing:border-box}
a{color:var(--accent);font-weight:600}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
header{background:var(--head);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px}
header img{width:40px;height:40px;border-radius:10px}
header h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.02em;line-height:1.1}
header small{opacity:.8;font-size:13px}
nav{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;overflow-x:auto}
nav button{flex:1;min-width:84px;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:14px 10px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--accent);border-bottom-color:var(--gold)}
main{max-width:1000px;margin:0 auto;padding:16px 16px 60px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.grow{flex:1;min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--due);border-color:var(--due);background:none}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.link{background:none;border:0;padding:0;font:inherit;color:var(--accent);font-weight:600;cursor:pointer;text-align:left}
.link.u{text-decoration:underline;font-size:13px}
.sub{color:var(--muted);margin:4px 0 14px}
.warn{color:var(--due);font-weight:600}
.countrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.count{font-size:18px}.count b{font-size:28px;color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;min-height:130px;transition:background .12s,border-color .12s}
.tile .av{width:52px;height:52px;font-size:18px}
.tile .nm{font-weight:600;text-align:center;line-height:1.2}
.tile .st{font-size:12px;color:var(--muted)}
.tile.on{background:var(--ok-bg);border-color:var(--ok)}
.tile.on .st{color:var(--ok);font-weight:700}
.tile.on .av{background:var(--ok);color:#fff}
.av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--tile);color:var(--accent);display:grid;place-items:center;font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:left;font:inherit;color:inherit;width:100%;flex-wrap:wrap}
button.item{cursor:pointer}
.item small{display:block;color:var(--muted);font-size:13px}
.item small.okt{color:var(--ok)}
.chev{color:var(--muted);font-size:22px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.due{background:var(--due-bg);color:var(--due)}.chip.up{background:var(--up-bg);color:var(--up)}.chip.none{background:var(--tile);color:var(--muted)}
.pill{font-size:12px;background:var(--tile);color:var(--muted);padding:2px 8px;border-radius:99px;font-weight:600;vertical-align:middle}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.stat small{color:var(--muted);font-weight:600;display:block}.stat b{display:block;font-size:24px}
.stat.ok b{color:var(--ok)}.stat.due b{color:var(--due)}.stat.up b{color:var(--up)}
.empty{text-align:center;padding:40px 16px;background:var(--card);border:1px dashed var(--line);border-radius:16px}
.empty h3{margin:0 0 6px}.empty p{color:var(--muted);margin:0 0 16px}
.banner{background:var(--due-bg);border-radius:12px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.card h2{font-size:17px;margin:0 0 12px}
.card h3{font-size:15px;margin:16px 0 8px;color:var(--muted)}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.num{text-align:right}
.pct{height:6px;background:var(--tile);border-radius:3px;margin-top:4px;overflow:hidden;min-width:60px}.pct i{display:block;height:100%;background:var(--gold)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;font:inherit;font-weight:600;padding:10px 16px;min-height:44px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.profile{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.profile .av{width:56px;height:56px;font-size:20px}
.profile small{display:block;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:520px}
.cal .h{font-size:12px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:2px}
.cal .d{min-height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:14px;border:2px solid transparent;line-height:1.1}
.cal .d i{font-style:normal;font-size:12px;font-weight:800}
.cal .d.att{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.cal .d.miss{background:var(--due-bg);color:var(--due);border-color:var(--due)}
.cal .d.nm{border:2px dashed var(--line);color:var(--ink)}
.cal .d.off{color:var(--muted);opacity:.45}
.cal .d.today{box-shadow:0 0 0 2px var(--gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.legend .la::before{background:var(--ok)}.legend .lm::before{background:var(--due)}.legend .ln::before{border:2px dashed var(--muted);width:8px;height:8px}
dialog{border:0;border-radius:18px;padding:0;width:min(480px,calc(100vw - 32px));background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(30,10,10,.45)}
dialog form{padding:20px;display:flex;flex-direction:column;gap:14px}
dialog h2{margin:0;font-size:20px}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{position:relative}
.days input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.days span{display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:99px;font-weight:600;cursor:pointer;min-width:52px;text-align:center}
.days input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.days input:focus-visible+span{outline:2px solid var(--gold)}
.dlg-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dlg-actions .left{margin-right:auto;display:flex;gap:8px}
.check{display:flex;gap:8px;align-items:center;min-height:44px;color:var(--muted);font-weight:600;font-size:14px}
.check input{width:20px;height:20px;min-height:0}
.hint{color:var(--muted);font-size:14px;margin:0 0 10px}
.preview{background:var(--tile);border-radius:12px;padding:10px 14px;font-size:14px;white-space:pre-wrap;margin:10px 0}
code{background:var(--tile);padding:1px 6px;border-radius:6px;font-size:13px}
nav svg{display:none;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;display:block;min-width:0;text-align:left;line-height:1.3}
.bar>.field{min-width:0}
.bar>.hint{flex:1 1 230px}
::-webkit-date-and-time-value{text-align:left}
dialog{max-height:calc(100dvh - 32px);overflow:auto}
@media (max-width:640px){
  header{padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}header img{width:34px;height:34px}header h1{font-size:19px}
  nav{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;overflow:visible;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(0,0,0,.06)}
  nav button{min-width:0;padding:8px 2px 7px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;border-bottom:0;border-top:3px solid transparent}
  nav button.on{border-top-color:var(--gold)}
  nav svg{display:block}
  main{padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
  #toast{bottom:calc(86px + env(safe-area-inset-bottom))}
  .bar>.field{flex:1 1 140px}
  .tiles{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
  .tile{min-height:112px;padding:12px 6px}.tile .av{width:44px;height:44px;font-size:16px}
  .item{padding:10px 12px;gap:10px}
  .actions{margin-left:0;width:100%;justify-content:flex-end}
  .stats{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:10px 12px}.stat b{font-size:20px}
  .seg{width:100%}.seg button{flex:1}
  .cal{gap:4px}.cal .d{min-height:42px;font-size:13px}
  .banner{font-size:14px}
}
nav[hidden]{display:none!important}
.gate{max-width:420px;margin:48px auto;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px 22px}
.gate img{width:72px;height:72px;border-radius:16px}
.gate h2{margin:14px 0 6px}.gate p{color:var(--muted);margin:0 0 18px}
.envtag{background:var(--gold);color:#2a1a14;font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;margin-left:8px;vertical-align:middle;letter-spacing:.06em}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;transition:transform .25s;z-index:20;font-weight:600;max-width:calc(100vw - 32px)}
#toast.show{transform:translate(-50%,0)}
</style>
</head>

<nav>
  <button data-act="tab" data-id="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v3M17 2v3M3 9h18M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM8 15l2.5 2.5L16 12"/></svg><span>Today</span></button>
  <button data-act="tab" data-id="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 3"/></svg><span>History</span></button>
  <button data-act="tab" data-id="students"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 20v-2a4 4 0 0 0-3-3.9M16 2.1a4 4 0 0 1 0 7.8"/></svg><span>Students</span></button>
  <button data-act="tab" data-id="fees"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12M6 8h12M6 13l8.5 8M6 13h3a5 5 0 0 0 0-10"/></svg><span>Fees</span></button>
  <button data-act="tab" data-id="reports"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18M8 17v-5M13 17V8M18 17v-9"/></svg><span>Reports</span></button>
  <button data-act="tab" data-id="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></button>
</nav>
<main id="main"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script src="config.js"></script>
<script>
setTimeout(function(){if(!window.__booted){document.getElementById('main').innerHTML='<div class="gate"><h2>Couldn\'t start</h2><p>Connect to the internet and reload. After the first successful load, the app also works offline.</p><button class="btn primary" onclick="location.reload()">Reload</button></div>'}},10000);
</script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,collection,onSnapshot,writeBatch,terminate,clearIndexedDbPersistence} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
window.__booted=true;
const ENV=window.MUDRA_ENV||null;
const IS_PROD=!ENV||ENV.name==='prod';
/* ---------- constants & helpers ---------- */
const STUDIO='Mudra';
const DEFAULT_MSG="Namaste! A gentle reminder that {name}'s fee of {amount} for {month} at Mudra is due on {due}. Thank you!";
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WEEK=[1,2,3,4,5,6,0];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d||1)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rupee=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const monthLabel=m=>parse(m+'-01').toLocaleDateString('en-IN',{month:'long',year:'numeric'});
const shortMonth=m=>parse(m+'-01').toLocaleDateString('en-IN',{month:'short'});
const fmtDate=s=>s?parse(s.slice(0,10)).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'';
const dayMonth=s=>parse(s).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
const addMonth=(m,n)=>{const d=parse(m+'-01');d.setMonth(d.getMonth()+n);return ymd(d).slice(0,7)};
const initials=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
const byName=(a,b)=>a.name.localeCompare(b.name);
const fresh=()=>({version:2,batches:[],students:[],attendance:{},payments:[],lastBackup:null,defaultFee:1000,dueDay:15,waTemplate:DEFAULT_MSG});

let state=fresh(), tab='today';
const today=ymd(new Date()), thisMonth=today.slice(0,7);
const ui={date:today,batch:null,month:thisMonth,search:'',showArchived:false,lastMode:'UPI',hist:'classes',hBatch:null,hStudent:null};

/* ---------- cloud data layer (Firebase Auth + Firestore) ----------
   Data lives in Firestore under studios/mudra:
     studios/mudra                    -> settings (defaultFee, dueDay, waTemplate, lastBackup)
     studios/mudra/batches/{id}       studios/mudra/students/{id}
     studios/mudra/payments/{id}      studios/mudra/attendance/{date|batchId} -> {date,batchId,present:[ids]}
   The app keeps one in-memory `state` (same shape as before). save() diffs it against what was last
   synced and writes only changed docs. Firestore's persistent cache gives offline use + queued writes. */
let auth=null, db=null, user=null, phase='boot', legacy=null;   // phase: boot|noconfig|signedout|loading|denied|ready
const BASE=['studios','mudra'];
const COLS=['batches','students','payments','attendance'];
const SOURCES=['settings',...COLS];
let synced={}, sigs={}, loaded={}, server={}, serverSynced=false, unsub=[], pendingRender=false;
const clean=o=>JSON.parse(JSON.stringify(o));
const sortKeys=v=>Array.isArray(v)?v.map(sortKeys):(v&&typeof v==='object')?Object.keys(v).sort().reduce((o,k)=>(o[k]=sortKeys(v[k]),o),{}):v;
const stable=o=>JSON.stringify(sortKeys(o));
const settingsOf=()=>({defaultFee:state.defaultFee,dueDay:state.dueDay,waTemplate:state.waTemplate,lastBackup:state.lastBackup});
function toDocs(){
  const byId=a=>new Map(a.map(x=>{const d=clean(x);delete d.id;return [x.id,d]}));
  return {batches:byId(state.batches),students:byId(state.students),payments:byId(state.payments),
    attendance:new Map(Object.entries(state.attendance).map(([k,v])=>{const [date,batchId]=k.split('|');return [k,{date,batchId,present:v}]}))};
}
function save(){
  if(phase!=='ready'||!db)return;
  const ops=[], docs=toDocs();
  COLS.forEach(c=>{
    const cur=docs[c], sy=synced[c];
    cur.forEach((d,id)=>{const sig=stable(d);if(sy.get(id)!==sig){ops.push({ref:doc(db,...BASE,c,id),d});sy.set(id,sig)}});
    [...sy.keys()].forEach(id=>{if(!cur.has(id)){ops.push({ref:doc(db,...BASE,c,id)});sy.delete(id)}});
  });
  const st=clean(settingsOf()), ss=stable(st);
  if(synced.settings!==ss){ops.push({ref:doc(db,...BASE),d:st});synced.settings=ss}
  for(let i=0;i<ops.length;i+=400){
    const b=writeBatch(db);
    ops.slice(i,i+400).forEach(o=>o.d?b.set(o.ref,o.d):b.delete(o.ref));
    b.commit().catch(e=>{console.error(e);toast(e.code==='permission-denied'?'This account cannot save changes':'Could not sync — will retry when online')});
  }
}
function stopSync(){unsub.forEach(f=>{try{f()}catch(e){}});unsub=[]}
function softRender(){if(dlg.open){pendingRender=true;return}render()}
function onData(name,snap,sig,apply){
  if(!snap.metadata.fromCache)server[name]=true;
  let changed=!loaded[name];loaded[name]=true;
  if(sig!==sigs[name]){sigs[name]=sig;apply();changed=true}
  if(phase==='loading'&&SOURCES.every(n=>loaded[n])){phase='ready';changed=true}
  if(!serverSynced&&SOURCES.every(n=>server[n])){serverSynced=true;changed=true}
  if(changed&&phase==='ready')softRender();
}
function subscribe(){
  stopSync();
  synced={settings:null};COLS.forEach(c=>synced[c]=new Map());
  sigs={};loaded={};server={};serverSynced=false;state=fresh();
  const onErr=e=>{console.error(e);
    if(e.code==='permission-denied'){phase='denied';stopSync();render()}
    else toast('Sync problem: '+(e.code||e.message))};
  const opts={includeMetadataChanges:true};
  unsub.push(onSnapshot(doc(db,...BASE),opts,snap=>{
    const d=snap.exists()?snap.data():null;
    onData('settings',snap,d?stable(d):'none',()=>{
      const f=fresh(),x=d||{};
      state.defaultFee=x.defaultFee??f.defaultFee;state.dueDay=x.dueDay??f.dueDay;
      state.waTemplate=x.waTemplate||f.waTemplate;state.lastBackup=x.lastBackup??null;
      synced.settings=d?stable(d):null;
    });
  },onErr));
  COLS.forEach(c=>unsub.push(onSnapshot(collection(db,...BASE,c),opts,snap=>{
    const rows=snap.docs.map(x=>[x.id,x.data()]);
    onData(c,snap,stable(rows),()=>{
      synced[c]=new Map(rows.map(([id,d])=>[id,stable(d)]));
      if(c==='attendance')state.attendance=Object.fromEntries(rows.map(([id,d])=>[id,d.present||[]]));
      else state[c]=rows.map(([id,d])=>({id,...d}));
    });
  },onErr)));
}

const studentsIn=(bid,all)=>state.students.filter(s=>s.batchId===bid&&(all||s.active)).sort(byName);
const paymentFor=(sid,m)=>state.payments.find(p=>p.studentId===sid&&p.month===m);
function defaultBatch(d){const wd=parse(d).getDay();const b=state.batches.find(b=>b.days.includes(wd))||state.batches[0];return b?b.id:null}

/* ---------- fee rules: monthly, due on dueDay; first fee = first due date on/after joining ---------- */
const dueDate=m=>m+'-'+pad(Math.min(Math.max(Number(state.dueDay)||15,1),28));
function firstMonth(s){if(!s.joined)return thisMonth;const jm=s.joined.slice(0,7);return s.joined<=dueDate(jm)?jm:addMonth(jm,1)}
function billable(s,m){
  if(!(Number(s.fee)>0)||m<firstMonth(s))return false;
  if(!s.active){const l=s.left?s.left.slice(0,7):null;if(!l||m>l)return false}
  return true;
}
function feeStatus(s,m){
  const p=paymentFor(s.id,m);if(p)return{k:'paid',p};
  if(!(Number(s.fee)>0))return{k:'free'};
  if(m<firstMonth(s))return{k:'notyet',f:firstMonth(s)};
  if(!billable(s,m))return{k:'na'};
  return{k:today>dueDate(m)?'overdue':'upcoming',due:dueDate(m)};
}
function overdueMonths(s,upto){
  const out=[];let m=firstMonth(s),g=0;
  while(m<=upto&&g++<240){if(billable(s,m)&&!paymentFor(s.id,m)&&today>dueDate(m))out.push(m);m=addMonth(m,1)}
  return out;
}
function feeChip(st){return{
  paid:'<span class="chip ok">Paid</span>',free:'<span class="chip none">No fee</span>',na:'<span class="chip none">—</span>',

  overdue:'<span class="chip due">Overdue</span>',upcoming:`<span class="chip up">Due ${st.due?dayMonth(st.due):''}</span>`}[st.k]}
const fillMsg=(s,m)=>(state.waTemplate||DEFAULT_MSG).replace(/\{(\w+)\}/g,(x,k)=>({name:s.name,amount:rupee(s.fee),month:monthLabel(m),due:fmtDate(dueDate(m)),studio:STUDIO})[k]??x);

function classDates(bid,m){
  const b=batchById(bid), set=new Set(), start=parse(m+'-01');
  for(let d=new Date(start);d.getMonth()===start.getMonth();d.setDate(d.getDate()+1)){const s=ymd(d);if(s>today)break;if(b.days.includes(d.getDay()))set.add(s)}
  Object.keys(state.attendance).forEach(k=>{const [d,id]=k.split('|');if(id===bid&&d.slice(0,7)===m)set.add(d)});
  return [...set].sort().reverse();
}
function histClasses(seg){

function histStudent(seg){
  const all=[...state.students].sort(byName);

  if(!all.length)return bar()+empty('No students yet','','<button class="btn primary" data-act="student-new">Add a student</button>');

  const arch=all.filter(x=>!x.active);

  const ended=d=>(s.joined&&d<s.joined)||d>today||(!s.active&&s.left&&d>s.left);

  // calendar

  let att=0,miss=0,nm=0;const cells=[];
  for(let i=0;i<lead;i++)cells.push('<div></div>');
  for(let i=1;i<=n;i++){
    const d=m+'-'+pad(i), wd=parse(d).getDay();
    const went=Object.keys(state.attendance).some(k=>k.startsWith(d+'|')&&state.attendance[k].includes(s.id));
    let c='off',mk='';
    if(went){c='att';mk='✓';att++}
    else if(ended(d)){}
    else if(state.attendance[d+'|'+s.batchId]){c='miss';mk='✗';miss++}
    else if(b&&b.days.includes(wd)){c='nm';mk='?';nm++}
    cells.push(`<div class="d ${c}${d===today?' today':''}" title="${d}">${i}${mk?`<i>${mk}</i>`:''}</div>`);
  }
  // overall since joining
  let oA=0,oH=0;
  Object.keys(state.attendance).forEach(k=>{const [d,bid]=k.split('|');const was=state.attendance[k].includes(s.id);
    if(was){oA++;oH++}else if(bid===s.batchId&&!ended(d))oH++});

  // fees

  const pays=state.payments.filter(p=>p.studentId===s.id).sort((a,b)=>b.month.localeCompare(a.month)).slice(0,6);
  const fees=[];
  over.forEach(mm=>fees.push(feeRow(mm,'<span class="chip due">Overdue</span>')));
  if(curSt.k==='upcoming')fees.push(feeRow(thisMonth,feeChip(curSt)));
  const fNote=curSt.k==='notyet'?`<p class="hint">First fee due on ${fmtDate(dueDate(curSt.f))}.</p>`:'';

  return bar(sel)+`<div class="card"><div class="profile"><span class="av">${esc(initials(s.name))}</span><div class="grow"><b style="font-size:18px">${esc(s.name)}</b>${s.active?'':' <span class="pill">archived</span>'}
      <small>${esc(b?b.name:'No batch')}${b&&b.time?' · '+esc(b.time):''} · joined ${fmtDate(s.joined)||'—'}${s.phone?' · '+esc(s.phone):''}</small>${s.notes?`<small>${esc(s.notes)}</small>`:''}</div>
      <button class="btn" data-act="student-edit" data-id="${s.id}">Edit details</button></div></div>
    <div class="stats"><div class="stat ok"><small>${monthLabel(m)}</small><b>${att} / ${att+miss}</b><small>classes attended</small></div>
      <div class="stat"><small>Since joining</small><b>${oH?Math.round(oA/oH*100)+'%':'—'}</b><small>${oA} of ${oH} classes</small></div>
      <div class="stat${st.k==='overdue'?' due':st.k==='paid'?' ok':''}"><small>Fee for ${shortMonth(m)}</small><b style="font-size:18px;margin-top:4px">${feeChip(st)}</b>${st.p?`<small>${rupee(st.p.amount)} · ${fmtDate(st.p.date)}</small>`:''}</div></div>
    <div class="card"><h2>Attendance — ${monthLabel(m)}</h2>
      <div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="h">${x}</div>`).join('')}${cells.join('')}</div>
      <div class="legend"><span class="la">Attended (${att})</span><span class="lm">Missed (${miss})</span>${nm?`<span class="ln">Class day, not marked (${nm})</span>`:''}</div></div>
    <div class="card"><h2>Fees</h2>${fNote}${fees.length?'<div class="list">'+fees.join('')+'</div>':(Number(s.fee)>0&&curSt.k!=='notyet'?'<p class="hint">All fees paid up to date.</p>':'')}
      ${pays.length?`<h3>Recent payments</h3><div class="list">${pays.map(p=>`<div class="item"><span class="grow"><b>${monthLabel(p.month)}</b><small class="okt">${rupee(p.amount)} received ${fmtDate(p.date)} · ${esc(p.mode)}</small></span><button class="btn ghost sm" data-act="pay-undo" data-id="${p.id}">Undo</button></div>`).join('')}</div>`:''}</div>`;
}

  const rows=state.students.filter(s=>paymentFor(s.id,m)||billable(s,m)||(s.active&&s.joined&&s.joined.slice(0,7)===m)||(s.active&&!(Number(s.fee)>0)))
    .map(s=>({s,st:feeStatus(s,m),earlier:overdueMonths(s,prev).length})).sort((a,b)=>order[a.st.k]-order[b.st.k]||byName(a.s,b.s));
  let paid=0,od=0,odN=0,up=0,upN=0;

function monthData(m){
  const keys=Object.keys(state.attendance).filter(k=>k.slice(0,7)===m);
  const held={};keys.forEach(k=>{const b=k.split('|')[1];held[b]=(held[b]||0)+1});
  const rows=state.students.filter(s=>s.active||paymentFor(s.id,m)||keys.some(k=>state.attendance[k].includes(s.id))).sort(byName).map(s=>{

    return {s,att,h,pct:h?Math.round(att/h*100):null,st:feeStatus(s,m)};

  return {held,rows};
}

function viewReports(){
  const m=ui.month,{held,rows}=monthData(m);
  let h=`<div class="bar">${monthInput('r-month')}<span class="grow"></span>
    <button class="btn" data-act="csv-month">Export month (CSV)</button><button class="btn ghost" data-act="csv-all">Full register (CSV)</button></div>`;
  if(state.batches.length)h+=`<div class="stats">${state.batches.map(b=>`<div class="stat"><small>${esc(b.name)}</small><b>${held[b.id]||0}</b><small>classes held</small></div>`).join('')}</div>`;
  if(!rows.length)return h+empty('Nothing to report yet','','');
  return h+`<div class="tablewrap"><table><thead><tr><th>Student</th><th>Batch</th><th class="num">Attended</th><th>Attendance</th><th>Fee</th></tr></thead><tbody>${rows.map(r=>{const b=batchById(r.s.batchId);return `<tr><td><button class="link" data-act="open-student" data-id="${r.s.id}">${esc(r.s.name)}</button></td><td>${esc(b?b.name:'')}</td><td class="num">${r.att} / ${r.h}</td><td>${r.pct==null?'—':`${r.pct}%<div class="pct"><i style="width:${r.pct}%"></i></div>`}</td><td>${feeChip(r.st)}</td></tr>`}).join('')}</tbody></table></div>`;
}

/* ---------- Settings ---------- */
function viewSettings(){
  const sample=state.students.find(s=>s.active)||{name:'Ananya',fee:state.defaultFee};
  return `<div class="card"><h2>Account</h2><div class="row"><span class="grow">Signed in as <b>${esc(user&&user.email||'')}</b>${IS_PROD?'':` <span class="pill">${esc(ENV.name)} environment</span>`}</span><button class="btn" data-act="signout">Sign out</button></div>
    <p class="hint" style="margin:10px 0 0">${navigator.onLine?'✓ Online — changes sync to all your devices.':'Offline — changes are saved on this device and will sync when you reconnect.'}</p></div>
  <div class="card"><h2>Batches</h2><div class="list">${state.batches.map(b=>`<button class="item" data-act="batch-edit" data-id="${b.id}"><span class="grow"><b>${esc(b.name)}</b><small>${WEEK.filter(d=>b.days.includes(d)).map(d=>DAYS[d]).join(', ')||'No days set'}${b.time?' · '+esc(b.time):''} · ${studentsIn(b.id).length} students</small></span><span class="chev">›</span></button>`).join('')||'<p class="hint">No batches yet.</p>'}</div>
    <div style="margin-top:12px"><button class="btn primary" data-act="batch-new">+ Add batch</button></div></div>
  <div class="card"><h2>Fees</h2>
    <p class="hint">Fees are monthly. A new student's first fee is due on the first due date after they join (e.g. joining on the 20th → first fee next month).</p>
    <div class="bar"><label class="field"><span>Monthly fee for new students (₹)</span><input id="set-fee" type="number" min="0" step="50" inputmode="numeric" value="${state.defaultFee}"></label>
    <label class="field"><span>Due day of month</span><input id="set-due" type="number" min="1" max="28" inputmode="numeric" value="${state.dueDay}"></label></div>
    <button class="btn" data-act="apply-fee">Apply ${rupee(state.defaultFee)} to all active students</button></div>
  <div class="card"><h2>WhatsApp reminder message</h2>
    <p class="hint">These words are filled in automatically: <code>{name}</code> <code>{amount}</code> <code>{month}</code> <code>{due}</code></p>
    <textarea id="set-msg" rows="4">${esc(state.waTemplate)}</textarea>
    <div class="preview" id="msg-preview">${esc(fillMsg(sample,thisMonth))}</div>
    <button class="btn ghost sm" data-act="reset-msg">Reset to default</button></div>
  <div class="card"><h2>Backup</h2><p class="hint">Your data is stored in your account and syncs to every device you sign in on. A backup file is an extra safety copy — download one now and then and keep it in OneDrive or Google Drive. Restoring a backup replaces all current data.</p>
    <p>Last backup: <b>${state.lastBackup?fmtDate(state.lastBackup):'never'}</b></p>
    <div class="row"><button class="btn primary" data-act="backup">Download backup</button><label class="btn">Restore from backup<input type="file" id="import-file" accept=".json,application/json" hidden></label></div></div>
  <div class="card"><h2>Data</h2><p class="hint">${state.students.length} students · ${Object.keys(state.attendance).length} classes recorded · ${state.payments.length} payments. Works offline.</p>
    <div class="row">${state.students.length||IS_PROD?'':'<button class="btn" data-act="demo">Load sample data</button>'}<button class="btn danger" data-act="wipe">Erase all data</button></div></div>`;
}

const VIEWS={today:viewToday,history:viewHistory,students:viewStudents,fees:viewFees,reports:viewReports,settings:viewSettings};
function gate(){
  const card=(t,p,a)=>`<div class="gate"><img src="icon-192.png" alt=""><h2>${t}</h2>${p?`<p>${p}</p>`:''}${a||''}</div>`;
  if(phase==='noconfig')return card('Not configured','This copy of the app has no Firebase settings (config.js).');
  if(phase==='signedout')return card('Welcome to Mudra','Sign in to see your classes, students and fees.','<button class="btn primary" data-act="signin">Sign in with Google</button>');
  if(phase==='denied')return card('No access',`<b>${esc(user&&user.email||'This account')}</b> isn't allowed to use this app. Sign in with the account that was given access.`,'<button class="btn primary" data-act="signout">Use a different account</button>');
  return card(phase==='loading'?'Loading your data…':'Starting…','');
}
function render(){
  const ready=phase==='ready';
  document.querySelector('nav').hidden=!ready;
  if(!ready){document.getElementById('main').innerHTML=gate();return}
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.id===tab));
  document.getElementById('main').innerHTML=migrateBanner()+backupBanner()+VIEWS[tab]();
}

/* ---------- dialogs ---------- */
const dlg=document.getElementById('dlg');
let dlgSubmit=null;
function openDlg(html,onSubmit){dlg.innerHTML=`<form>${html}</form>`;dlgSubmit=onSubmit;dlg.showModal()}
dlg.addEventListener('close',()=>{if(pendingRender){pendingRender=false;render()}});
dlg.addEventListener('submit',e=>{e.preventDefault();if(dlgSubmit&&dlgSubmit(new FormData(e.target))!==false){dlg.close();save();render()}});
const cancelBtns=label=>`<button type="button" class="btn ghost" data-act="dlg-close">Cancel</button><button class="btn primary">${label}</button>`;

function batchForm(b){
  const isNew=!b; b=b||{name:'',time:'',days:[]};
  openDlg(`<h2>${isNew?'New batch':'Edit batch'}</h2>
    <label class="field"><span>Batch name</span><input name="name" required value="${esc(b.name)}" placeholder="e.g. Beginners" autocomplete="off"></label>
    <div class="field"><span>Class days</span><div class="days">${WEEK.map(d=>`<label><input type="checkbox" name="days" value="${d}"${b.days.includes(d)?' checked':''}><span>${DAYS[d]}</span></label>`).join('')}</div></div>
    <label class="field"><span>Time (optional)</span><input name="time" value="${esc(b.time)}" placeholder="e.g. 5:00 – 6:30 pm"></label>
    <div class="dlg-actions">${isNew?'':`<span class="left"><button type="button" class="btn danger sm" data-act="batch-delete" data-id="${b.id}">Delete</button></span>`}${cancelBtns(isNew?'Create':'Save')}</div>`,
  fd=>{const d={name:fd.get('name').trim(),time:fd.get('time').trim(),days:fd.getAll('days').map(Number)};
    if(!d.name)return false;
    if(isNew){state.batches.push({id:uid(),...d});ui.batch=defaultBatch(ui.date)}else Object.assign(batchById(b.id)||b,d);});
}

const firstDueText=j=>j?`First fee due on ${fmtDate(dueDate(firstMonth({joined:j})))}`:'';
function studentForm(s){
  if(!state.batches.length){toast('Create a batch first');tab='settings';render();return}
  const isNew=!s; s=s||{name:'',phone:'',batchId:ui.batch||state.batches[0].id,joined:today,fee:state.defaultFee,notes:'',active:true};
  openDlg(`<h2>${isNew?'Add student':'Edit student'}</h2>
    <label class="field"><span>Name</span><input name="name" required value="${esc(s.name)}" autocomplete="off"></label>
    <label class="field"><span>Phone — student or parent (for WhatsApp reminders)</span><input name="phone" type="tel" value="${esc(s.phone)}" placeholder="98765 43210"></label>
    <label class="field"><span>Batch</span><select name="batchId">${state.batches.map(b=>`<option value="${b.id}"${b.id===s.batchId?' selected':''}>${esc(b.name)}</option>`).join('')}</select></label>
    <div class="bar" style="margin:0"><label class="field grow"><span>Monthly fee (₹)</span><input name="fee" type="number" min="0" step="50" inputmode="numeric" value="${s.fee}"></label>
    <label class="field grow"><span>Joined on</span><input name="joined" type="date" required value="${s.joined||''}"></label></div>
    <p class="hint" id="first-due" style="margin:-6px 0 0">${firstDueText(s.joined)}</p>
    <label class="field"><span>Notes (optional)</span><textarea name="notes" rows="2">${esc(s.notes)}</textarea></label>
    <div class="dlg-actions">${isNew?'':`<span class="left"><button type="button" class="btn sm" data-act="student-archive" data-id="${s.id}">${s.active?'Archive':'Restore'}</button><button type="button" class="btn danger sm" data-act="student-delete" data-id="${s.id}">Delete</button></span>`}${cancelBtns(isNew?'Add':'Save')}</div>`,
  fd=>{const d={name:fd.get('name').trim(),phone:fd.get('phone').trim(),batchId:fd.get('batchId'),fee:Number(fd.get('fee')||0),joined:fd.get('joined'),notes:fd.get('notes').trim()};
    if(!d.name)return false;
    if(isNew){state.students.push({id:uid(),active:true,...d});toast(d.name+' added')}else Object.assign(studentById(s.id)||s,d);});
}

function payForm(sid,m){
  const s=studentById(sid);
  openDlg(`<h2>Fee received</h2><p class="hint">${esc(s.name)} · ${monthLabel(m)}</p>
    <label class="field"><span>Amount (₹)</span><input name="amount" type="number" min="0" inputmode="numeric" required value="${s.fee}"></label>
    <label class="field"><span>Received on</span><input name="date" type="date" required value="${today}"></label>
    <label class="field"><span>Mode</span><select name="mode">${['UPI','Cash','Bank transfer','Other'].map(x=>`<option${x===ui.lastMode?' selected':''}>${x}</option>`).join('')}</select></label>
    <div class="dlg-actions">${cancelBtns('Save payment')}</div>`,
  fd=>{ui.lastMode=fd.get('mode');state.payments.push({id:uid(),studentId:sid,month:m,amount:Number(fd.get('amount')),date:fd.get('date'),mode:fd.get('mode')});toast('Payment saved')});
}

/* ---------- files ---------- */
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
const csv=rows=>'﻿'+rows.map(r=>r.map(v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');

/* ---------- sample data ---------- */
function loadDemo(){
  const b1={id:uid(),name:'Beginners',days:[1,4],time:'5:00 – 6:00 pm'}, b2={id:uid(),name:'Seniors',days:[3,6],time:'6:00 – 7:30 pm'};
  const start=addMonth(thisMonth,-3)+'-01';
  const mk=(name,b,phone,joined)=>({id:uid(),name,phone,batchId:b.id,fee:1000,joined:joined||start,notes:'',active:true});
  const st=[mk('Ananya Rao',b1,'9876500001'),mk('Diya Menon',b1,'9876500002'),mk('Ishita Reddy',b1,''),mk('Kavya Nair',b1,'9876500004'),mk('Meera Pillai',b1,'9876500005'),
    mk('Sneha Varma',b2,'9876500006'),mk('Lakshmi Iyer',b2,'9876500007'),mk('Priya Krishnan',b2,''),mk('Tara Joshi',b2,'9876500009',thisMonth+'-'+pad(Math.min(20,parse(today).getDate())))];
  state.batches=[b1,b2];state.students=st;state.attendance={};state.payments=[];
  let skipped=false;
  const days=[];for(let d=parse(addMonth(thisMonth,-2)+'-01');ymd(d)<=today;d.setDate(d.getDate()+1))days.push(new Date(d));
  days.reverse().forEach(d=>{const s=ymd(d);[b1,b2].forEach(b=>{if(!b.days.includes(d.getDay()))return;
    if(b===b2&&!skipped&&s<today){skipped=true;return}
    state.attendance[s+'|'+b.id]=st.filter(x=>x.batchId===b.id&&x.joined<=s&&Math.random()<.85).map(x=>x.id)})});
  st.forEach((s,i)=>{for(let m=firstMonth(s);m<=thisMonth;m=addMonth(m,1)){
    if(i===3&&m>=addMonth(thisMonth,-1))continue;
    if(m===thisMonth&&i%3===0)continue;
    state.payments.push({id:uid(),studentId:s.id,month:m,amount:s.fee,date:m+'-'+pad(5+i%8),mode:i%2?'Cash':'UPI'})}});
  ui.batch=null;ui.hStudent=null;save();render();toast('Sample data loaded');
}

/* ---------- actions ---------- */
const ACT={
  tab:id=>{tab=id;render();window.scrollTo(0,0)},
  signin:()=>signIn(),
  signout:()=>{if(phase==='ready'&&!confirm('Sign out of Mudra on this device?'))return;doSignOut()},
  migrate:()=>{if(!confirm(`Upload ${legacy.students.length} students and their attendance and fees to your account?`))return;
    state=Object.assign(fresh(),clean(legacy));delete state.studio;state.version=fresh().version;ui.batch=null;ui.hStudent=null;
    lsSet('mudra-migrated','1');save();render();toast('Data uploaded')},
  'migrate-skip':()=>{lsSet('mudra-migrated','1');render()},
  'dlg-close':()=>dlg.close(),
  'go-today':()=>{ui.date=today;ui.batch=defaultBatch(today);render()},
  hist:id=>{ui.hist=id;render()},
  'open-class':d=>{ui.date=d;ui.batch=ui.hBatch;tab='today';render();window.scrollTo(0,0)},
  'open-student':id=>{ui.hist='student';ui.hStudent=id;tab='history';render();window.scrollTo(0,0)},
  'batch-new':()=>batchForm(),
  'batch-edit':id=>batchForm(batchById(id)),
  'batch-delete':id=>{
    if(studentsIn(id,true).length){toast('Move or delete this batch’s students first');return}
    if(!confirm('Delete this batch?'))return;
    state.batches=state.batches.filter(b=>b.id!==id);
    Object.keys(state.attendance).forEach(k=>{if(k.endsWith('|'+id))delete state.attendance[k]});
    ui.batch=null;ui.hBatch=null;dlg.close();save();render();
  },
  'student-new':()=>studentForm(),
  'student-edit':id=>studentForm(studentById(id)),
  'student-archive':id=>{const s=studentById(id);s.active=!s.active;if(s.active)delete s.left;else s.left=today;dlg.close();save();render();toast(s.name+(s.active?' restored':' archived — history kept'))},
  'student-delete':id=>{
    const s=studentById(id);
    if(!confirm(`Delete ${s.name} permanently?\n\nTheir attendance and payment history will be removed too. Use “Archive” instead if they have just left the class.`))return;
    state.students=state.students.filter(x=>x.id!==id);
    for(const k in state.attendance)state.attendance[k]=state.attendance[k].filter(x=>x!==id);
    state.payments=state.payments.filter(p=>p.studentId!==id);
    if(ui.hStudent===id){ui.hStudent=null;if(tab==='history')tab='students'}
    dlg.close();save();render();
  },
  toggle:id=>{
    const k=ui.date+'|'+ui.batch, a=state.attendance[k]||[], i=a.indexOf(id);
    if(i>=0)a.splice(i,1);else a.push(id);
    state.attendance[k]=a;save();render();
  },
  'all-present':()=>{state.attendance[ui.date+'|'+ui.batch]=rosterOn(ui.batch,ui.date).map(s=>s.id);save();render()},
  'clear-day':()=>{if(!confirm('Clear attendance for this class? (Use this if the class did not happen.)'))return;delete state.attendance[ui.date+'|'+ui.batch];save();render()},
  pay:(id,el)=>payForm(id,el.dataset.m||ui.month),
  'pay-undo':id=>{if(!confirm('Remove this payment?'))return;state.payments=state.payments.filter(p=>p.id!==id);save();render()},
  remind:(id,el)=>{
    const s=studentById(id);let n=(s.phone||'').replace(/\D/g,'');if(n.length===10)n='91'+n;
    window.open('https://wa.me/'+n+'?text='+encodeURIComponent(fillMsg(s,el.dataset.m||ui.month)),'_blank');
  },
  'apply-fee':()=>{
    const act=state.students.filter(s=>s.active);
    if(!act.length){toast('No active students');return}
    if(!confirm(`Set the monthly fee to ${rupee(state.defaultFee)} for all ${act.length} active students?\n\nPayments already recorded are not changed.`))return;
    act.forEach(s=>s.fee=state.defaultFee);save();render();toast('Fee updated for '+act.length+' students');
  },
  'reset-msg':()=>{state.waTemplate=DEFAULT_MSG;save();render();toast('Message reset')},
  'csv-month':()=>{
    const m=ui.month,{rows}=monthData(m);
    download(`mudra-${m}.csv`,csv([['Student','Phone','Batch','Classes held','Attended','Attendance %','Monthly fee','Fee status','Paid amount','Paid on','Mode'],
      ...rows.map(r=>[r.s.name,r.s.phone,(batchById(r.s.batchId)||{}).name,r.h,r.att,r.pct??'',r.s.fee,statusText[r.st.k],r.st.p?r.st.p.amount:'',r.st.p?r.st.p.date:'',r.st.p?r.st.p.mode:''])]),'text/csv');
  },
  'csv-all':()=>{
    const out=[['Date','Batch','Student','Status']];
    Object.keys(state.attendance).sort().forEach(k=>{const [d,bid]=k.split('|'),b=batchById(bid),p=new Set(state.attendance[k]);
      const roster=rosterOn(bid,d);state.attendance[k].forEach(id=>{if(!roster.some(s=>s.id===id)){const s=studentById(id);if(s)roster.push(s)}});
      roster.sort(byName).forEach(s=>out.push([d,b?b.name:'',s.name,p.has(s.id)?'Present':'Absent']))});
    download('mudra-attendance-register.csv',csv(out),'text/csv');
  },
  backup:()=>{state.lastBackup=new Date().toISOString();save();download(`mudra-backup-${today}.json`,JSON.stringify(state,null,1),'application/json');render();toast('Backup downloaded — move it to OneDrive')},
  demo:()=>{if(IS_PROD)return;if(state.students.length&&!confirm('Replace current data with sample data?'))return;loadDemo()},
  wipe:()=>{if(!confirm('Erase ALL students, attendance and payments from your account (on every device)?'))return;if(prompt('Type ERASE to confirm')!=='ERASE')return;state=fresh();ui.batch=null;save();render();toast('All data erased')},
};

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;if(t.tagName==='A')e.preventDefault();const f=ACT[t.dataset.act];if(f)f(t.dataset.id,t)});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='t-date'&&t.value){ui.date=t.value;ui.batch=defaultBatch(t.value);render()}
  else if(t.id==='t-batch'){ui.batch=t.value;render()}
  else if(['f-month','r-month','h-month'].includes(t.id)&&t.value){ui.month=t.value;render()}
  else if(t.id==='h-batch'){ui.hBatch=t.value;render()}
  else if(t.id==='h-student'){ui.hStudent=t.value;render()}
  else if(t.id==='s-arch'){ui.showArchived=t.checked;render()}
  else if(t.id==='set-fee'){state.defaultFee=Math.max(0,Number(t.value)||0);save();render();toast('Default fee saved')}
  else if(t.id==='set-due'){state.dueDay=Math.min(28,Math.max(1,Math.round(Number(t.value)||15)));save();render();toast('Due day saved')}
  else if(t.id==='set-msg'){state.waTemplate=t.value.trim()||DEFAULT_MSG;save();toast('Message saved')}
  else if(t.id==='import-file'&&t.files[0]){
    const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.students)||!Array.isArray(d.batches))throw 0;
      if(!confirm(`Restore backup with ${d.students.length} students? This replaces the data on this device.`))return;
      state=Object.assign(fresh(),d);ui.batch=null;ui.hStudent=null;save();render();toast('Backup restored')}catch(_){toast('That file is not a valid backup')}};
    r.readAsText(t.files[0]);t.value='';
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='s-search'){ui.search=t.value;render();const el=document.getElementById('s-search');el.focus();el.setSelectionRange(el.value.length,el.value.length)}
  else if(t.id==='set-msg'){const s=state.students.find(x=>x.active)||{name:'Ananya',fee:state.defaultFee};const keep=state.waTemplate;state.waTemplate=t.value||DEFAULT_MSG;document.getElementById('msg-preview').textContent=fillMsg(s,thisMonth);state.waTemplate=keep}
  else if(t.name==='joined'&&t.form&&t.form.closest('dialog')){const el=document.getElementById('first-due');if(el)el.textContent=firstDueText(t.value)}
});

/* ---------- start ---------- */
window.addEventListener('online',()=>{if(tab==='settings')softRender()});
window.addEventListener('offline',()=>{if(tab==='settings')softRender()});
(async()=>{
  if(ENV&&!IS_PROD){document.getElementById('envtag').innerHTML=`<span class="envtag">${esc(ENV.name.toUpperCase())}</span>`;document.title='Mudra ('+ENV.name+')'}
  if(!ENV||!ENV.firebase||!ENV.firebase.apiKey||ENV.firebase.apiKey.startsWith('REPLACE')){phase='noconfig';render();return}
  const cfg={...ENV.firebase};
  // Sign in through this site's own /__/auth handler (Firebase Hosting) so redirects work in Safari/iOS PWAs
  if(!/^(localhost|127\.0\.0\.1)$/.test(location.hostname))cfg.authDomain=location.hostname;
  const app=initializeApp(cfg);
  auth=getAuth(app);
  db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
  legacy=await loadLegacy();
  render();
  getRedirectResult(auth).catch(e=>toast('Sign-in failed: '+(e.code||e.message)));
  onAuthStateChanged(auth,u=>{
    stopSync();user=u;
    if(!u){phase='signedout';render();return}
    phase='loading';render();subscribe();
  });
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if(location.protocol.startsWith('http')&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
