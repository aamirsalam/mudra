name: Deploy

# dev  -> TEST environment (your Firebase test project)
# main -> PROD environment (her Firebase project)
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  # never cancel a PROD deploy half-way; superseded TEST runs can be cancelled
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  test:
    # Browser tests against a fake Firebase (tests/e2e.py). A failure blocks the deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright + Chromium
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Syntax check
        run: |
          python - <<'PY'
          import re,json
          s=open('public/index.html').read()
          open('/tmp/app.mjs','w').write(re.search(r'<script type="module">(.*?)</script>',s,re.S).group(1))
          json.load(open('firebase.json')); json.load(open('public/manifest.json'))
          PY
          node --check /tmp/app.mjs && node --check public/sw.js
      - name: End-to-end tests
        run: python tests/e2e.py

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # GitHub Environments "test" and "prod" each hold their own FIREBASE_SERVICE_ACCOUNT secret.
    environment: ${{ github.ref_name == 'main' && 'prod' || 'test' }}
    env:
      TARGET: ${{ github.ref_name == 'main' && 'prod' || 'test' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          PROJECT=$(node -e "globalThis.window={};require('./env/'+process.env.TARGET+'.js');process.stdout.write(window.MUDRA_ENV.firebase.projectId)")
          if [ -z "$SA" ] || [ "$PROJECT" = "REPLACE_ME" ]; then
            echo "::warning::$TARGET is not set up yet (missing FIREBASE_SERVICE_ACCOUNT secret or env/$TARGET.js config) — skipping deploy"
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.check.outputs.ready == 'true'
        run: |
          cp "env/$TARGET.js" public/config.js
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" public/sw.js

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 20

      - name: Deploy hosting + Firestore rules
        if: steps.check.outputs.ready == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npx --yes firebase-tools@13 deploy --only hosting,firestore:rules \
            --project "$PROJECT" --non-interactive --message "${GITHUB_SHA::7} ${TARGET}"
          echo "### Deployed to $TARGET: https://$PROJECT.web.app" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
